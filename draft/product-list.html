<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Love | Homepage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <div class="topnav">
            <a href="index.html" class="active">Logo</a>
        </div>
        <!--Navigation links (hidden by defaults)-->
        <div id="myLinks">
            <a href="product-list.html">Our products</a>
            <a href="cart.html">Shopping cart</a>
        </div>
        <!--Hamburger menu-->
    </header>
    <!--Product list-->
    <main>
        <!--Product Introduction-->
        <header class="page-header">
            <h1>All products</h1>
            <p>Our recipes are designed with your pet's health in mind to keep your pet healthy and happy.</p>
        </header>
        <nav class="category-tags">
            <button class="active">MEAT MIX</button>
            <button class="active">TREATS</button>
        </nav>
        <!--Filtering & Sorting-->
        <div></div>
        <!--Product Lists-->
        <section class="product-grid">
            <article class="product-card">
                <img src="" alt="Duck Meat Mix">
                <a href="product-page.html"><h3>Duck Meat Mix</h3></a>
                <p class="stock-status">20kg left this week</p>
                <div class="card-controls">
                    <select name="weight" aria-label="Select weight">
                        <option value="200g">200g</option>
                        <option value="500g">500g</option>
                    </select>
                    <span class="price">$3.8</span>
                    <!--JS function quick add to cart-->
                    <button class="quick-add" onclick="addToCart('Duck Meat Mix')">Quick add</button>
                </div>
            </article>
        </section>
    </main>
    <!--Footer-->
    <footer>
        <div class="footer-links">
            <a href="product-list.html">Shop All</a>
            <a href="">Terms & Conditions</a>
        </div>
        <p>0413 320 173</p>
        <br>
        <p>329 Moreland Road, Coburg, VIC, 3058</p>
    </footer>
</body>
