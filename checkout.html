<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Love | Homepage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <header>
        <div class="topnav">
            <a href="index.html" class="active">Logo</a>
        </div>
        <!--Navigation links (hidden by defaults)-->
        <div id="myLinks">
            <a href="product-list.html">Our products</a>
            <a href="cart.html">Shopping cart</a>
        </div>
        <!--Hamburger menu-->
    </header>

    <main class="checkout-page">
    <h1>Check-out</h1>

    <form action="/submit-order" method="POST">
        <fieldset>
            <legend>Contact</legend>
            <input type="text" id="name" name="name" placeholder="Full name" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="tel" id="phone" name="phone" placeholder="Phone number" required>
        </fieldset>

        <fieldset>
            <legend>Delivery</legend>
            <input type="text" id="address" name="address" placeholder="Address" required>
            <input type="text" id="apt" name="apt" placeholder="Apt./Building/...">
            
            <div class="form-row">
                <input type="text" id="suburb" name="suburb" placeholder="Suburb" required>
                <input type="text" id="postcode" name="postcode" placeholder="Postcode" required>
                <input type="text" id="state" name="state" placeholder="State" required>
            </div>
        </fieldset>

        <fieldset>
            <legend>Payment</legend>
            <input type="text" id="card-name" name="card-name" placeholder="Name on card" required>
            <input type="text" id="card-num" name="card-num" placeholder="Card number" required>
            <div class="form-row">
                <input type="text" id="expiry" name="expiry" placeholder="Expiry date" required>
                <input type="text" id="cvc" name="cvc" placeholder="CVC" required>
            </div>
        </fieldset>

        <div class="checkout-summary">
            <div class="total-row">
                <span>TOTAL</span>
                <span>$12.8</span>
            </div>
            <div class="actions">
                <a href="cart.html" class="btn-secondary">Continue Shopping</a>
                <button type="submit" class="btn-primary"><a href="confirmation.html">Pay now</a></button>
            </div>
        </div>
    </form>
</main>

    <!--Footer-->
    <footer>
        <div class="footer-links">
            <a href="product-list.html">Shop All</a>
            <a href="">Terms & Conditions</a>
        </div>
        <p>0413 320 173</p>
        <br>
        <p>329 Moreland Road, Coburg, VIC, 3058</p>
    </footer>
</body>
</html>
